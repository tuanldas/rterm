arb-dir: lib/l10n
template-arb-file: app_vi.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
# AppLocalizations.of(context) trả giá trị không null: app chỉ dựng widget dưới
# MaterialApp đã khai báo delegate, thiếu delegate là lỗi lập trình cần lộ ngay.
nullable-getter: false
