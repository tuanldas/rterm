# Bộ lint khuyến nghị của Flutter, cộng chế độ kiểu chặt vì app đọc nhiều JSON
# từ mạng: ép kiểu ngầm từ dynamic là chỗ dữ liệu hỏng lọt vào app.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**

linter:
  rules:
    # Gọi thành viên trên dynamic bỏ qua kiểm kiểu; JSON phải qua bộ đọc có kiểu.
    - avoid_dynamic_calls
    # Future không chờ thì lỗi của nó biến mất lặng lẽ.
    - unawaited_futures
    # Kết nối SSH và luồng sự kiện sống lâu; quên huỷ là rò tài nguyên.
    - cancel_subscriptions
    - close_sinks
    - only_throw_errors
    - always_declare_return_types
    - directives_ordering
    - prefer_single_quotes
